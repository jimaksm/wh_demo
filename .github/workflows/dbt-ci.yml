name: dbt CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: Create dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          wh_demo:
            outputs:
              dev:
                type: duckdb
                path: wh_demo.duckdb
                schema: main
            target: dev
          EOF

      - name: dbt seed
        run: dbt seed

      - name: dbt build (models + tests)
        run: dbt build
